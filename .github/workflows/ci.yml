name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    name: Lint, BlueZ events and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y gnome-shell gjs dbus-x11
      - run: npm ci
      - run: npm run lint
      - run: python3 tools/check-release-docs.py
      - run: python3 tools/build-release-kit.py
      - run: bash -n install.sh uninstall.sh set-position.sh tools/package.sh
      - run: npm run translations
      - run: npm run test:bluez
      - run: ./tools/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cello-extension
          path: dist/
  desktop:
    name: GNOME 46 desktop smoke
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y gnome-shell gjs dbus-x11
      - run: npm ci && npm run translations
      - run: mkdir -p /tmp/cello-runtime && chmod 700 /tmp/cello-runtime
      - run: python3 tests/smoke-desktop.py
        env:
          XDG_RUNTIME_DIR: /tmp/cello-runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence
          path: evidence/
